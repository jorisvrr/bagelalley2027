<!-- jorisvrr ident: maker-signature, herbruikbaar. Standaard zwevend rechtsonder;
     zet vóór de include de variabele ident_inline op true, dan staat hij in de footer (in de flow). -->
<style>
  #ident {
    position: fixed;
    right: clamp(1rem, 3vw, 2rem);
    bottom: calc(clamp(1rem, 3vw, 2rem) + var(--safe-bottom, 0px));
    z-index: var(--z-ident);
    display: inline-flex; align-items: center; justify-content: center; gap: 0;
    min-width: 44px; min-height: 44px;   /* tikdoel */
    text-decoration: none;
    color: #9a9ca1;                 /* kleur van "jorisvrr" op donkere footer */
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .4s ease, transform .4s ease, color .35s ease;
  }
  #ident.show { opacity: .4; transform: none; pointer-events: auto; }          #ident:focus-visible { opacity: .95; color: #ececef; }          @media (hover: hover) and (pointer: fine) { /* subtiel */
  #ident:hover { opacity: .95; color: #ececef; } }         /* duidelijker */

  /* In de footer: gewoon in de flow, altijd zichtbaar, zelfde hover-animatie */
  #ident.ident--inline { position: static; opacity: .4; transform: none; pointer-events: auto; align-self: flex-start; }
  #ident.ident--inline:focus-visible { opacity: .95; color: #ececef; }
  @media (hover: hover) and (pointer: fine) { #ident.ident--inline:hover { opacity: .95; color: #ececef; } }

  .ident__cur {
    display: block; height: 40px; width: auto;
    filter: grayscale(1);           /* logo blijft grijs; bij een donker logo: brightness(1.7) */
    transition: filter .35s ease;
  }
  @media (hover: hover) and (pointer: fine) { #ident:hover .ident__cur { filter: grayscale(1) brightness(1.15); } }

  .ident__name {
    font-family: ui-monospace, "Space Mono", monospace;
    font-size: var(--fs-xs); letter-spacing: var(--track-label); white-space: nowrap;
    max-width: 0; opacity: 0; overflow: hidden;
    transition: max-width .4s ease, opacity .35s ease, margin .4s ease;
  }
  #ident:focus-visible .ident__name { max-width: 140px; opacity: 1; margin-right: .55rem; }
  @media (hover: hover) and (pointer: fine) { #ident:hover .ident__name { max-width: 140px; opacity: 1; margin-right: .55rem; } }

  /* soepele wissel met de chat-widget (alleen relevant op pagina's met chat) */
  #chatWrapper { transition: opacity .35s ease; }
</style>

<a id="ident"{% if ident_inline %} class="ident--inline"{% endif %} href="https://jorisvrr.com/" target="_blank"
   rel="noopener noreferrer" aria-label="Website gemaakt door jorisvrr">
  <span class="ident__name">jorisvrr</span>
  <img class="ident__cur" src="{{ url_for('static', filename='img/jorisvrr-cursor.png') }}" alt="" width="40" height="40">
</a>

<script>
  (function () {
    var ident = document.getElementById('ident');
    if (!ident) return;
    // In de footer staat het credit gewoon in de flow; vaste balken blijven altijd zichtbaar.
    if (ident.classList.contains('ident--inline')) return;
    function update() {
      var nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 80;
      ident.classList.toggle('show', nearBottom);
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
    document.addEventListener('DOMContentLoaded', update);
  })();
</script>
