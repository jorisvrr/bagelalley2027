{# Gedeelde design tokens, lettertypes en basisregels voor alle pagina's.
   Elke pagina laadt dit in <head> vóór de eigen <style>. Waarden komen uit AUDIT.md §3. #}
<link rel="preload" href="{{ url_for('static', filename='fonts/playfair-display-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ url_for('static', filename='fonts/dm-sans-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<style>
  /* Zelf gehost (SIL Open Font License 1.1), latin subset, variabel gewicht */
  @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url('{{ url_for('static', filename='fonts/playfair-display-latin.woff2') }}') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 400 900; font-display: swap;
    src: url('{{ url_for('static', filename='fonts/playfair-display-italic-latin.woff2') }}') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 100 1000; font-display: swap;
    src: url('{{ url_for('static', filename='fonts/dm-sans-latin.woff2') }}') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    /* kleur: merkwaarden, benoemd naar rol */
    --cream: #F5F0E8;
    --cream-2: #EDE6D6;
    --paper: #FDFAF5;
    --dark: #1A1018;
    --dark-2: #241E2A;
    --ink: #1E1828;
    --ink-muted: #6B5F7A;
    --on-dark: #F5F0E8;
    --on-dark-muted: rgba(245,240,232,.62);
    --purple: #8758CE;
    --purple-display: #9B6EE0;
    --purple-ink: #6E42B0;
    --purple-light: #B394EC;
    --tint: rgba(135,88,206,.08);
    --tint-strong: rgba(135,88,206,.15);
    --line-light: rgba(135,88,206,.2);
    --line-dark: rgba(135,88,206,.15);
    --field-bg: #FAFAFA;
    --success: #15803D;
    --error: #B42318;
    --error-bg: #FFF2F2;

    /* aliassen voor bestaande namen in de pagina's */
    --cream2: var(--cream-2);
    --dark2: var(--dark-2);
    --purple2: var(--purple-display);
    --purple3: var(--purple-ink);
    --text: var(--ink);
    --muted: var(--ink-muted);
    --white: var(--paper);

    /* radius: 4 stappen */
    --r-btn: 3px;
    --r-field: 8px;
    --r-card: 12px;
    --r-pill: 999px;

    /* schaduw: neutraal */
    --shadow-card: 0 4px 24px rgba(26,16,24,.08);
    --shadow-float: 0 12px 40px rgba(26,16,24,.35);
    --shadow-up: 0 -6px 24px rgba(26,16,24,.18);
    --focus-ring: 0 0 0 3px rgba(135,88,206,.35);

    /* typografie */
    --fs-xs: .75rem;
    --fs-sm: .8125rem;
    --fs-md: .875rem;
    --fs-base: 1rem;
    --fs-lg: 1.125rem;
    --fs-xl: 1.375rem;
    --fs-2xl: 1.75rem;
    --fs-logo: 1.25rem;   /* woordmerk: groot genoeg voor 3:1 (WCAG large text) */
    --fs-section: clamp(2rem, 3.5vw, 3.2rem);
    --fs-hero: clamp(3rem, 5.5vw, 5.5rem);
    --track-label: .12em;
    --track-button: .06em;
    --track-display: -.02em;

    /* ruimte: 4pt-basis */
    --s-1: .25rem; --s-2: .5rem; --s-3: .75rem; --s-4: 1rem; --s-5: 1.5rem;
    --s-6: 2rem; --s-7: 3rem; --s-8: 4rem; --s-9: 6rem;
    --gutter: clamp(1.25rem, 5vw, 6rem);
    --section-y: clamp(4rem, 8vw, 7rem);

    /* beweging: alleen transform en opacity; exit sneller dan enter */
    --ease-out: cubic-bezier(.23, 1, .32, 1);        /* binnenkomen */
    --ease-in: cubic-bezier(.4, 0, 1, 1);             /* weggaan (alleen korte exits) */
    --ease-in-out: cubic-bezier(.77, 0, .175, 1);     /* verplaatsen op het scherm */
    --dur-press: 100ms;    /* druk-feedback */
    --dur-ui: 150ms;       /* hover, kleur, kleine wissels */
    --dur-sheet: 250ms;    /* chat- en menusheet openen */
    --dur-exit: 150ms;     /* sluiten */

    /* lagen, van laag naar hoog: pagina < nav < credit < vaste balken < chat < menu < loader.
       Het jorisvrr-credit ligt onder elke vaste balk, zodat het nooit over een actie of bedrag valt. */
    --z-nav: 100;
    --z-ident: 110;
    --z-sticky: 200;       /* vaste mobiele balk, totaalbalk /bestellen */
    --z-chat: 300;
    --z-sheet: 400;
    --z-loader: 1000;

    /* iconen (Lucide) */
    --icon-stroke: 1.75;

    /* onderkant-stapel: chatbalk, ident */
    --chatbar-h: 0px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  .has-chat { --chatbar-h: 68px; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    /* focus en ankersprongen nooit onder de sticky nav of een vaste balk onderaan */
    scroll-padding-top: 5.5rem; scroll-padding-bottom: 5.5rem; }
  body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }

  /* <picture> uit pic(): geen eigen box, de <img> bepaalt de layout */
  picture { display: contents; }

  /* Lucide-iconen: kleur volgt de tekst, verticaal gecentreerd */
  .icon { display: inline-block; flex-shrink: 0; vertical-align: -0.125em; stroke-width: var(--icon-stroke); }

  /* Toetsenbordfocus overal zichtbaar */
  :focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  /* Eén gedeelde druk-staat voor alles wat je kunt aantikken (rust, hover, ingedrukt, focus,
     disabled, laden, gelukt, fout). Kaarten krijgen een kleinere schaal. */
  a, button, [role="button"], label[for], summary { touch-action: manipulation; }
  :where(button, .btn-purple, .btn-ghost, .btn-ghost-light, .btn-white, .nav-cta, .btn-submit, .btn-next, .btn-prev,
         .product-card-btn, .snel-knop, .size-opt, .slot, .booking-slot, .min-reserveer-btn, .min-route-btn,
         .menu-link-btn, .map-btn, .map-route, .menu-zoom, .footer-col a, .sfeer-link, summary) {
    transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-ui) var(--ease-out),
                border-color var(--dur-ui) var(--ease-out), color var(--dur-ui) var(--ease-out),
                opacity var(--dur-ui) var(--ease-out);
    -webkit-user-select: none; user-select: none;
  }
  :where(button, .btn-purple, .btn-ghost, .btn-ghost-light, .btn-white, .nav-cta, .btn-submit, .btn-next, .btn-prev,
         .product-card-btn, .snel-knop, .size-opt, .slot, .booking-slot, .min-reserveer-btn, .min-route-btn,
         .menu-link-btn, .map-btn, .map-route, .menu-zoom, .footer-col a, .sfeer-link, summary):active:not(:disabled) { transform: scale(.97); }
  :where(.product-card, .shortcut-card):active { transform: scale(.98); transition: transform var(--dur-press) var(--ease-out); }

  /* disabled en laden: zichtbaar, niet dubbel te versturen */
  :where(button, .btn-purple, .btn-ghost):disabled, [aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
  .is-loading { cursor: progress; }
  .is-loading::after { content: ""; display: inline-block; width: 1em; height: 1em; margin-left: .5em; vertical-align: -.15em;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: ba-spin .7s linear infinite; }
  @keyframes ba-spin { to { transform: rotate(360deg); } }
  .is-success { background-color: var(--success) !important; border-color: var(--success) !important; color: #fff !important; }

  /* fout bij een veld: rode rand, melding eronder, korte horizontale nudge */
  [aria-invalid="true"] { border-color: var(--error) !important; }
  .field-error { display: block; margin-top: .35rem; font-size: var(--fs-sm); color: var(--error); line-height: 1.45; }
  .field-error[hidden] { display: none; }
  .ba-nudge { animation: ba-nudge 150ms var(--ease-in-out); }
  @keyframes ba-nudge { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* Tel- en maillinks in lopende tekst: onzichtbaar klikvlak van 44px hoog, zonder dat de tekst verschuift */
  a:is([href^="tel:"], [href^="mailto:"]):not([class]) { position: relative; }
  a:is([href^="tel:"], [href^="mailto:"]):not([class])::after { content: ""; position: absolute; left: -4px; right: -4px; top: 50%; height: 44px; transform: translateY(-50%); }

  /* Visueel verborgen, wel voor schermlezers */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; }
    :where(button, a, summary, .product-card, .shortcut-card):active { transform: none !important; }
    .ba-nudge { animation: none; }
    /* niets beweegt: spinner pulseert alleen, hover verschuift niets */
    .is-loading::after { animation: ba-puls 1.2s linear infinite; border-right-color: currentColor; }
    @keyframes ba-puls { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    :where(a, button, .product-card, .shortcut-card, .menu-card, .icon):hover { transform: none !important; }
    :where(a, button) .icon { transform: none !important; }
  }
</style>
