{# Gedeelde design tokens, lettertypes en basisregels voor alle pagina's.
   Elke pagina laadt dit in <head> vóór de eigen <style>. Waarden komen uit AUDIT.md §3. #}
<link rel="preload" href="{{ url_for('static', filename='fonts/playfair-display-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ url_for('static', filename='fonts/dm-sans-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<style>
  /* Zelf gehost (SIL Open Font License 1.1), latin subset, variabel gewicht */
  @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 400 900; font-display: swap;
    src: url('{{ url_for('static', filename='fonts/playfair-display-latin.woff2') }}') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Playfair Display'; font-style: italic; font-weight: 400 900; font-display: swap;
    src: url('{{ url_for('static', filename='fonts/playfair-display-italic-latin.woff2') }}') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 100 1000; font-display: swap;
    src: url('{{ url_for('static', filename='fonts/dm-sans-latin.woff2') }}') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    /* kleur: merkwaarden, benoemd naar rol */
    --cream: #F5F0E8;
    --cream-2: #EDE6D6;
    --paper: #FDFAF5;
    --dark: #1A1018;
    --dark-2: #241E2A;
    --ink: #1E1828;
    --ink-muted: #6B5F7A;
    --on-dark: #F5F0E8;
    --on-dark-muted: rgba(245,240,232,.62);
    --purple: #8758CE;
    --purple-display: #9B6EE0;
    --purple-ink: #6E42B0;
    --purple-light: #B394EC;
    --tint: rgba(135,88,206,.08);
    --tint-strong: rgba(135,88,206,.15);
    --line-light: rgba(135,88,206,.2);
    --line-dark: rgba(135,88,206,.15);
    --field-bg: #FAFAFA;
    --success: #15803D;
    --error: #B42318;
    --error-bg: #FFF2F2;

    /* aliassen voor bestaande namen in de pagina's */
    --cream2: var(--cream-2);
    --dark2: var(--dark-2);
    --purple2: var(--purple-display);
    --purple3: var(--purple-ink);
    --text: var(--ink);
    --muted: var(--ink-muted);
    --white: var(--paper);

    /* radius: 4 stappen */
    --r-btn: 3px;
    --r-field: 8px;
    --r-card: 12px;
    --r-pill: 999px;

    /* schaduw: neutraal */
    --shadow-card: 0 4px 24px rgba(26,16,24,.08);
    --shadow-float: 0 12px 40px rgba(26,16,24,.35);
    --shadow-up: 0 -6px 24px rgba(26,16,24,.18);
    --focus-ring: 0 0 0 3px rgba(135,88,206,.35);

    /* typografie */
    --fs-xs: .75rem;
    --fs-sm: .8125rem;
    --fs-md: .875rem;
    --fs-base: 1rem;
    --fs-lg: 1.125rem;
    --fs-xl: 1.375rem;
    --fs-2xl: 1.75rem;
    --fs-logo: 1.25rem;   /* woordmerk: groot genoeg voor 3:1 (WCAG large text) */
    --fs-section: clamp(2rem, 3.5vw, 3.2rem);
    --fs-hero: clamp(3rem, 5.5vw, 5.5rem);
    --track-label: .12em;
    --track-button: .06em;
    --track-display: -.02em;

    /* ruimte: 4pt-basis */
    --s-1: .25rem; --s-2: .5rem; --s-3: .75rem; --s-4: 1rem; --s-5: 1.5rem;
    --s-6: 2rem; --s-7: 3rem; --s-8: 4rem; --s-9: 6rem;
    --gutter: clamp(1.25rem, 5vw, 6rem);
    --section-y: clamp(4rem, 8vw, 7rem);

    /* beweging */
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --dur-press: 120ms;
    --dur-ui: 200ms;
    --dur-reveal: 600ms;

    /* lagen */
    --z-nav: 100;
    --z-ident: 150;
    --z-chat: 300;
    --z-sheet: 400;
    --z-loader: 1000;

    /* iconen (Lucide) */
    --icon-stroke: 1.75;

    /* onderkant-stapel: chatbalk, ident */
    --chatbar-h: 0px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  .has-chat { --chatbar-h: 68px; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }

  /* <picture> uit pic(): geen eigen box, de <img> bepaalt de layout */
  picture { display: contents; }

  /* Lucide-iconen: kleur volgt de tekst, verticaal gecentreerd */
  .icon { display: inline-block; flex-shrink: 0; vertical-align: -0.125em; stroke-width: var(--icon-stroke); }

  /* Toetsenbordfocus overal zichtbaar */
  :focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  /* Eén gedeelde druk-staat voor alles wat je kunt aantikken */
  a, button, [role="button"], label[for] { touch-action: manipulation; }
  :where(button, .btn-purple, .btn-ghost, .btn-ghost-light, .btn-white, .nav-cta, .btn-submit, .btn-next, .btn-prev,
         .product-card-btn, .snel-knop, .size-opt, .slot, .booking-slot, .min-reserveer-btn,
         .menu-link-btn) {
    transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-ui) var(--ease-out),
                border-color var(--dur-ui) var(--ease-out), color var(--dur-ui) var(--ease-out);
    -webkit-user-select: none; user-select: none;
  }
  :where(button, .btn-purple, .btn-ghost, .btn-ghost-light, .btn-white, .nav-cta, .btn-submit, .btn-next, .btn-prev,
         .product-card-btn, .snel-knop, .size-opt, .slot, .booking-slot, .min-reserveer-btn,
         .menu-link-btn):active:not(:disabled) { transform: scale(.97); }

  /* Visueel verborgen, wel voor schermlezers */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; }
    :where(button, a):active { transform: none !important; }
  }
</style>
